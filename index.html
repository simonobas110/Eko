<!DOCTYPE html>

<body>

                <form>
                    <input type="text" placeholder="Tu nombre" required>
                    <input type="email" placeholder="Tu correo" required>
                    <textarea placeholder="¿En qué podemos ayudarte?" rows="4"></textarea>

                </form>
            </div>
        </div>
    </section>

</body>
